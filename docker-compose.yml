name: hostel-screening

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: hostel-screening-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hostel_screening
      POSTGRES_USER: ${DB_USERNAME:-hostel_screening}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hostel_screening}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hostel-screening-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hostel-screening-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: hostel_screening
      DB_USERNAME: ${DB_USERNAME:-hostel_screening}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Vercel 프로덕션 도메인이 정해지면 콤마로 이어서 추가한다.
      # 예: https://frontend-two-kappa-82.vercel.app,https://내커스텀도메인.com
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PUBLIC_DATA_SERVICE_KEY: ${PUBLIC_DATA_SERVICE_KEY:-}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
