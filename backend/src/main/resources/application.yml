spring:
  application:
    name: hostel-screening-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hostel_screening}
    username: ${DB_USERNAME:hostel_screening}
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 관리한다 (db/migration/V1__init_schema.sql)
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  batch:
    job:
      enabled: false # 배치는 스케줄러가 명시적으로 트리거 (3.8)

server:
  port: 8080

hostel-screening:
  cors:
    # 콤마로 구분된 허용 오리진 목록. 예: https://frontend-two-kappa-82.vercel.app
    # Vercel 배포 도메인이 바뀌면(예: 프로덕션 도메인 연결) 이 값도 갱신해야 한다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  public-data:
    building-hub:
      base-url: https://apis.data.go.kr/1613000/BldRgstHubService
      service-key: ${PUBLIC_DATA_SERVICE_KEY:}
    land-use:
      base-url: https://apis.data.go.kr/1611000/nsdi/LandUsePlanService
      service-key: ${PUBLIC_DATA_SERVICE_KEY:}
    # WBS 3.4 — 건축인허가정보 서비스(허가/착공/사용승인 이력). 현재 화면 판정에는 쓰이지 않고,
    # Phase 5(경쟁현황) 및 향후 인허가 이력 조회용으로 클라이언트만 미리 준비해 둔다.
    permit-info:
      base-url: https://apis.data.go.kr/1613000/ArchPmsHubService
      service-key: ${PUBLIC_DATA_SERVICE_KEY:}
  kakao:
    # WBS 3.2 — 카카오 디벨로퍼스에서 발급받은 REST API 키. 서버 쪽에서 주소→좌표 변환(로컬 API)이
    # 필요한 Phase 5(반경 검색/경쟁현황)에서 사용 예정. 프론트엔드 지도 렌더링용 JavaScript 키는
    # frontend/.env.example의 NEXT_PUBLIC_KAKAO_MAP_JS_KEY를 따로 사용한다(서로 다른 키).
    local-api:
      base-url: https://dapi.kakao.com/v2/local
      rest-api-key: ${KAKAO_REST_API_KEY:}
  cache:
    building-ttl-hours: 24
